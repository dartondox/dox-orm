name: dox_orm
description: PostgreSQL, MySQL, MariaDB and SQLite query builder, Support Model, Where, orWhere, Find, Join, softDeletes, Debugging and many mores.
version: 3.1.0
repository: https://github.com/dartondox/dox-orm
homepage: https://dartondox.dev

environment:
  sdk: ^3.13.0
resolution: workspace

dependencies:
  sqlite3: ^3.7.1
  # Raise to the dox_annotation release that has install.dart before
  # releasing this package.
  dox_annotation: ^3.1.0
  dox_validation: ^3.1.0
  dox_postgres_native: ^3.0.3
  dox_mysql_native: ^3.0.2
  
dev_dependencies:
  lints: ^6.1.0
  test: ^1.33.0
  build_runner: ^2.17.1
  dox_builder: ^3.1.0
  # only for the tests that run the ORM in a Dox app
  dox_core: ^3.1.0

# The `dox` CLI finds the commands of this package here (`dox orm:install`).
dox:
  commands: package:dox_orm/commands.dart
