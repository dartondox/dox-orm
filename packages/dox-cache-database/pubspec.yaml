name: dox_cache_database
description: A database cache store for dox_cache. Shares cache, locks and sessions between servers on SQLite, Postgres or MySQL, with no Redis.
version: 3.2.0
repository: https://github.com/dartondox/dox-orm
homepage: https://dartondox.dev

environment:
  sdk: ^3.13.0
resolution: workspace

dependencies:
  dox_annotation: ^3.2.0
  dox_cache: ^3.2.0
  # In this workspace. bin/update_versions.sh sets it to the shared version.
  dox_orm: ^3.2.0

dev_dependencies:
  lints: ^6.1.0
  test: ^1.33.0

# The `dox` CLI finds the commands of this package here (`dox cache:table`).
dox:
  commands: package:dox_cache_database/commands.dart
